name: ms-autenticacion CI

on:
  push:
    paths:
      - "services/ms-autenticacion/**"
      - ".github/workflows/ms-autenticacion.yml"
  pull_request:
    paths:
      - "services/ms-autenticacion/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ms-autenticacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/ms-autenticacion/package-lock.json
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm test

  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ms-autenticacion
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ms-autenticacion:${{ github.sha }} .
