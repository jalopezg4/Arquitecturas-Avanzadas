services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  ms-identidad:
    build: ./services/ms-identidad
    ports:
      - "3001:3001"
    environment:
      # docker-compose es solo para desarrollo local (ver README) -- NODE_ENV=development
      # es lo que permite que env.js caiga a un secreto de desarrollo si no se define JWT_SECRET.
      # Fuera de este compose (staging/prod real), NODE_ENV nunca debe ser development y
      # JWT_SECRET es obligatorio: env.js lanza error al arrancar si falta.
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ms-identidad
      RABBITMQ_URI: amqp://rabbitmq:5672
      OPERATOR_ID: ${OPERATOR_ID:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-MiFolio}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      - mongo
      - rabbitmq

  # Object storage S3-compatible para desarrollo local (en despliegue se usa S3 u otro proveedor).
  # Consola web: http://localhost:9001. Las credenciales de desarrollo se pueden cambiar con S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
  minio:
    image: quay.io/minio/minio:latest  # MinIO ya no publica en Docker Hub
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}  # secret-scan:allow -- credencial de desarrollo local; fuera de local el servicio rechaza minioadmin
    volumes:
      - minio-data:/data

  ms-documentos:
    build: ./services/ms-documentos
    ports:
      - "3002:3002"
    environment:
      # Solo desarrollo local (ver README). Fuera de este compose NODE_ENV nunca debe ser development y
      # JWT_SECRET es obligatorio y DEBE ser el mismo que usa ms-identidad.
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ms-documentos
      RABBITMQ_URI: amqp://rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}  # secret-scan:allow -- credencial de desarrollo local; fuera de local el servicio rechaza minioadmin
    depends_on:
      - mongo
      - rabbitmq
      - minio

  # Avisos por correo (HU-03 confirmacion de carga; HU-01 bienvenida). Por defecto EMAIL_TRANSPORT=console: NO envia nada,
  # solo deja constancia del aviso en Mongo. Para enviar de verdad: EMAIL_TRANSPORT=smtp y SMTP_HOST/PORT/USER/PASS
  # (fuera de este compose el servicio exige smtp y credenciales que no sean las de un tutorial).
  ms-notificaciones:
    build: ./services/ms-notificaciones
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ms-notificaciones
      RABBITMQ_URI: amqp://rabbitmq:5672
      OPERATOR_NAME: ${OPERATOR_NAME:-MiFolio}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      MAIL_FROM: ${MAIL_FROM:-no-responder@carpetacolombia.co}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    depends_on:
      - mongo
      - rabbitmq

  # Directorio de operadores de GovCarpeta (HU-05a). Solo LEE el directorio compartido del sandbox; no registra ni modifica nada.
  ms-interoperabilidad:
    build: ./services/ms-interoperabilidad
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ms-interoperabilidad
      GOVCARPETA_BASE_URL: ${GOVCARPETA_BASE_URL:-https://govcarpeta-apis-4905ff3c005b.herokuapp.com}
      OPERATOR_ID: ${OPERATOR_ID:-}
    depends_on:
      - mongo

  ms-gateway:
    build: ./services/ms-gateway
    ports:
      - "3000:3000"
    environment:
      # Solo desarrollo local (ver README). Fuera de este compose NODE_ENV nunca debe ser development y
      # JWT_SECRET es obligatorio y DEBE ser el mismo que usa ms-identidad.
      NODE_ENV: development
      IDENTIDAD_URL: http://ms-identidad:3001
      DOCUMENTOS_URL: http://ms-documentos:3002
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      - ms-identidad
      - ms-documentos

volumes:
  minio-data:
  mongo-data:
